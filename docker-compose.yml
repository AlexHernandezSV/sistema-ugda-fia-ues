services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-ugda-app
    working_dir: /var/www/html
    command: bash /var/www/html/docker/start.sh
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      VITE_DEV_SERVER_URL: http://localhost:5173
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: sistema-ugda-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  vendor_data:
  node_modules_data:
